# ============================================================
# 微信群 Bot 配置模板
# 复制为 config.yaml 后填写。所有需要改的地方都标了 TODO。
# ============================================================

channel:
  # wxui  = 真实微信4.x UI自动化通道（默认）
  # mock  = 本地模拟通道（不连微信，用于测试/演示）
  type: wxui
  poll_interval: 0.8        # 消息轮询间隔（秒）
  # 小号在微信里的昵称（可选：填了才能被 @ 触发；不填仍可用 /问 前缀）
  bot_nickname: "我的小号"
  # 要监听的群名列表（在桌面控制台里可"从微信选群"一键勾选）
  groups:
    - "测试群"
    # - "家人群"

llm:
  # 三种接法（桌面控制台里是三个单选）：
  #   mock=true                     -> 不接入，占位回复
  #   在线大模型（智谱/DeepSeek/Kimi）-> base_url+api_key+model
  #   本地 Ollama（免 Key）          -> base_url=http://127.0.0.1:11434/v1  model=qwen2.5:7b
  base_url: ""
  api_key: ""
  model: "glm-4-flash"
  # true = 不调用外部接口，bot 用占位回复跑通全流程
  mock: true
  system_prompt: |
    你是一个微信群里的助手机器人，回答要简洁（300字以内）、口语化、有用。
    群友问题五花八门，不确定时直说不确定，不要编造。
    不要讨论政治敏感话题。

trigger:
  at_bot: true               # 群里 @小号 触发 AI 问答
  ai_prefixes: ["/问", "/ai"] # 前缀触发 AI 问答
  command_prefix: "/"         # 指令前缀：/帮助 /天气 /日报 ...

rate_limit:
  per_group_per_minute: 8    # 每群每分钟最多回复条数（防刷屏、防风控）
  max_reply_chars: 800       # 单条回复最大长度，超出截断
  quiet_hours: [23, 7]       # 免打扰时段 23:00~次日7:00（定时推送仍会执行，AI/指令静默）

memory:
  history_per_group: 12      # 每群保留的上下文条数

push:
  # 定时推送任务：到点在指定群发送某技能的产出
  # skill 可选: daily_news（60秒读懂世界日报）/ weather（需在 args 里给城市）
  jobs: []
  #  - name: 早报
  #    group: "测试群"
  #    cron: { hour: 8, minute: 30 }   # 每天 8:30
  #    skill: daily_news
  #  - name: 北京天气
  #    group: "测试群"
  #    cron: { hour: 7, minute: 0 }
  #    skill: weather
  #    args: ["北京"]

admin:
  # 管理员微信昵称：免打扰时段内仍可用指令
  senders: []
  #  - "我的大号"
